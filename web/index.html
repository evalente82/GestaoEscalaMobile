<!DOCTYPE html>
<html>
<head>
    <title>escala_mobile</title>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="escala_mobile">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="manifest" href="manifest.json">

    <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lf4vGcrAAAAAME7ZtDCeQmErDJlbTNMPLK7AxdZ" async defer></script>

    <script>
        // Esta função é chamada pelo Dart para executar o reCAPTCHA v3 e obter o token.
        // 'callbackFunctionName' é o nome da função Dart que o JS deve chamar com o token.
        window.executeRecaptchaV3 = async function(siteKey, actionName, callbackFunctionName) {
            console.log("[reCAPTCHA JS] executeRecaptchaV3 chamada pelo Dart.");
            console.log("[reCAPTCHA JS] Chave do Site: " + siteKey + ", Ação: " + actionName + ", Callback Dart: " + callbackFunctionName);

            if (typeof grecaptcha === 'undefined' || typeof grecaptcha.enterprise === 'undefined' || typeof grecaptcha.enterprise.ready === 'undefined') {
                console.error("[reCAPTCHA JS] Erro: grecaptcha.enterprise não está disponível. API não carregada?");
                if (window[callbackFunctionName]) {
                    window[callbackFunctionName]('error_api_not_loaded');
                }
                return;
            }

            try {
                // Garante que a API do reCAPTCHA Enterprise esteja pronta.
                await grecaptcha.enterprise.ready(async () => {
                    console.log("[reCAPTCHA JS] grecaptcha.enterprise.ready: API pronta.");
                    const token = await grecaptcha.enterprise.execute(siteKey, {action: actionName});
                    console.log("[reCAPTCHA JS] Token reCAPTCHA v3 obtido: " + token);

                    // Chama a função Dart exposta globalmente com o token.
                    if (window[callbackFunctionName]) {
                        window[callbackFunctionName](token);
                    }
                });
            } catch (e) {
                console.error("[reCAPTCHA JS] Erro ao executar reCAPTCHA v3:", e);
                if (window[callbackFunctionName]) {
                    window[callbackFunctionName]('error_execution_failed'); // Envia um erro específico para o Flutter
                }
            }
        };

        // Para reCAPTCHA v3, geralmente não há um 'reset' visível.
        // O token é obtido em cada execução. Manter para consistência, mas pode ser removida.
        window.resetRecaptchaV3 = function() {
            console.log("[reCAPTCHA JS] resetRecaptchaV3 (não aplicável diretamente para v3, mas chamada).");
            // Nada específico para fazer aqui para v3, pois não há widget para resetar.
        };
    </script>
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-messaging.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="main.dart.js" defer></script>
</body>
</html>
